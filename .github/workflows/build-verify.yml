name: Build Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licenses
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Diagnostik sementara: tampilkan nama paket persis yang tersedia untuk
      # API 35/36/37 dan NDK 28.x, sebelum kita kunci identifier final.
      - name: Diagnose available SDK packages
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 2>/dev/null | grep -iE "platforms;android-3[5-7]|ndk;28|build-tools;3[5-7]" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Gradle sync (Phase 0)
        run: ./gradlew tasks --stacktrace
